
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Market Details · Drake Market</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel = "stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous"
    />
</head>
<body>

<a class="skip-link" href="#main">Skip to content</a>

<header class="topbar">
    <a class="brand" href=" {{ url_for('index') }}">
        <span class="brand-mark">D</span>
        <span>Drake <b>Market</b></span>
    </a>
    <div class="top-actions">
        <span class="demo-tag">DEMO</span>
        <a class="avatar" href="{{ url_for('profile') }}">TU</a>
    </div>
</header>

<main id="main" class="page-shell">

    <a class="back-link" href="{{ url_for('markets') }}">← All markets</a>

    <div id="market-detail"></div>

</main>

<dialog id="trade-dialog" class="trade-dialog">
    <form method="dialog" id="trade-form">

        <div class="dialog-head">
            <div>
                <p class="eyebrow">PRACTICE TRADE</p>
                <h2 id="trade-title">Buy shares</h2>
            </div>
            <button class="icon-button" value="cancel" aria-label="Close">×</button>
        </div>

        <p class="muted" id="trade-description"></p>

        <label class="field-label" for="trade-amount">
            Credits to spend
        </label>

        <input id="trade-amount" type="number"
               min="1" max="1000" value="25" required>

        <p class="muted small">
            Simulated trade using demo credits only.
        </p>

        <button class="button button-primary full" type="submit">
            Confirm practice trade
        </button>

    </form>
</dialog>

{% include "components/account_nav.html" %}
{% include "components/register_modal.html" %}
{% include "components/login_modal.html" %}

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" 
    crossorigin="anonymous"></script>
<script src="{{ url_for('static', filename='js/auth.js') }}"></script>
<script src="{{ url_for('static', filename='js/app.js') }}"></script>
{% block scripts %}{% endblock %}

</body>
</html>
