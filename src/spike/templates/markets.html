
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Markets · Drake Market</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel = "stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous"
    />
</head>
<body>

<a class="skip-link" href="#main">Skip to content</a>

<header class="topbar">
    <a class="brand" href="{{ url_for('index') }}">
        <span class="brand-mark">D</span>
        <span>Drake <b>Market</b></span>
    </a>
    <div class="top-actions">
        <span class="demo-tag">DEMO</span>
        <a class="avatar" href="{{ url_for('profile') }}">TU</a>
    </div>
</header>

<main id="main" class="page-shell">

    <section class="welcome compact">
        <p class="eyebrow">THE MARKETPLACE</p>
        <h1>Explore markets</h1>
        <p class="muted">Browse predictions from around Drake.</p>
    </section>

    <label class="searchbox">
        <span>⌕</span>
        <span class="sr-only">Search markets</span>
        <input id="market-search" type="search"
               placeholder="Search campus, dining, athletics...">
    </label>

    <div class="filter-row" aria-label="Filter markets">
        <button class="chip selected" data-filter="All">All</button>
        <button class="chip" data-filter="Athletics">Athletics</button>
        <button class="chip" data-filter="Campus">Campus</button>
        <button class="chip" data-filter="Dining">Dining</button>
    </div>

    <section class="section-heading">
        <h2>Open markets</h2>
        <span class="muted small" id="market-count"></span>
    </section>

    <div class="market-list" id="all-markets"></div>

</main>

{% include "components/account_nav.html" %}
{% include "components/register_modal.html" %}
{% include "components/login_modal.html" %}

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" 
    crossorigin="anonymous"></script>
<script src="{{ url_for('static', filename='js/auth.js') }}"></script>
<script src="{{ url_for('static', filename='js/app.js') }}"></script>
{% block scripts %}{% endblock %}

</body>
</html>
