[project]
name = "spike"
version = "0.1.0"
description = "CS188 Final Project: SPIKE "
readme = "README.md"
authors = [
    { name = "Isaac", email = "isaac.keninger@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "flask>=3.1.3",
    "flask-bcrypt>=1.0.1",
    "flask-restful>=0.3.10",
    "mssql-python>=1.17.0",
    "pytest>=9.2.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
launch-app = "azure_web_app:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"
